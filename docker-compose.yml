services:
  # Servicio de un solo uso: genera las credenciales que .env no defina y termina.
  credentials:
    image: postgres:17.11-bookworm
    entrypoint: [sh, /usr/local/bin/generate-credentials.sh]
    network_mode: none
    environment:
      CONFIGURED_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      CONFIGURED_APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      CONFIGURED_APP_DB_MIGRATION_PASSWORD: ${APP_DB_MIGRATION_PASSWORD:-}
      CONFIGURED_APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    volumes:
      - credentials:/run/optiplant
      - ./infra/credentials/generate.sh:/usr/local/bin/generate-credentials.sh:ro

  postgres:
    image: postgres:17.11-bookworm
    entrypoint: [sh, -ec, '. /run/optiplant/postgres.env; exec docker-entrypoint.sh postgres']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optiplant}
      POSTGRES_USER: ${POSTGRES_USER:-optiplant_owner}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - credentials:/run/optiplant:ro
      - ./infra/postgres/01-runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      credentials:
        condition: service_completed_successfully
    # No publicar PostgreSQL al host.

  backend:
    build: ./backend
    entrypoint: [sh, -ec, '. /run/optiplant/backend.env; exec java -jar /app/app.jar']
    environment:
      APP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-optiplant}
      APP_DB_USER: optiplant_app
      APP_DB_MIGRATION_USER: optiplant_migrator
      APP_ADMIN_CODE: ${APP_ADMIN_CODE:-ADMIN}
      APP_DEMO_DATA: ${APP_DEMO_DATA:-true}
      APP_FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    volumes:
      - credentials:/run/optiplant:ro
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    depends_on:
      credentials:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:8080/actuator/health > /dev/null']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5173/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  credentials:
